server {
    listen 80;
    listen [::]:80;
    server_name cosmiczip.net www.cosmiczip.net;

    root /var/www/cosmiczip/current;
    index index.html;

    # Firebase Auth helper proxy. This lets Google sign-in use cosmiczip.net
    # instead of zipzip-d8d69.firebaseapp.com as the visible auth domain.
    location ^~ /__/auth/ {
        proxy_pass https://zipzip-d8d69.firebaseapp.com/__/auth/;
        proxy_ssl_server_name on;
        proxy_set_header Host zipzip-d8d69.firebaseapp.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|ico|woff2?|ttf|mp3|wav|ogg|json|webmanifest)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}
